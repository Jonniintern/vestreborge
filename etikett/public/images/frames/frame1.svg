<svg width="898" height="1205" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="woodGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence baseFrequency="0.02 0.1" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0.1 0.2 0.3 0.2"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Outer wooden frame -->
  <rect x="0" y="0" width="898" height="1205" fill="#8B4513" rx="15"/>
  <rect x="15" y="15" width="868" height="1175" fill="#A0522D" rx="10"/>
  <rect x="30" y="30" width="838" height="1145" fill="#CD853F" rx="8"/>
  
  <!-- Inner content area (transparent) -->
  <rect x="60" y="60" width="778" height="1085" fill="transparent"/>
  
  <!-- Wood grain effect -->
  <rect x="0" y="0" width="898" height="60" fill="#8B4513" filter="url(#woodGrain)" opacity="0.3"/>
  <rect x="0" y="1145" width="898" height="60" fill="#8B4513" filter="url(#woodGrain)" opacity="0.3"/>
  <rect x="0" y="60" width="60" height="1085" fill="#8B4513" filter="url(#woodGrain)" opacity="0.3"/>
  <rect x="838" y="60" width="60" height="1085" fill="#8B4513" filter="url(#woodGrain)" opacity="0.3"/>
  
  <!-- Corner decorations -->
  <circle cx="60" cy="60" r="15" fill="#DAA520" opacity="0.7"/>
  <circle cx="838" cy="60" r="15" fill="#DAA520" opacity="0.7"/>
  <circle cx="60" cy="1145" r="15" fill="#DAA520" opacity="0.7"/>
  <circle cx="838" cy="1145" r="15" fill="#DAA520" opacity="0.7"/>
  
  <!-- Decorative elements -->
  <text x="449" y="40" text-anchor="middle" font-family="Georgia" font-size="16" fill="#F5DEB3" font-weight="bold">🌾 Klassisk Tre 🌾</text>
  <text x="449" y="1185" text-anchor="middle" font-family="Georgia" font-size="16" fill="#F5DEB3" font-weight="bold">🌾 Håndlaget 🌾</text>
</svg>